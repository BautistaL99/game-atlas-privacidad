<script id="vi-cache-policy-v136">
(function(){
  'use strict';
  if(!('serviceWorker' in navigator))return;
  const native=()=>!!(window.Capacitor?.isNativePlatform?.()||window.Capacitor?.getPlatform?.()==='android');
  async function cleanNative(){
    try{
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(reg=>reg.scope.startsWith(location.origin+'/')).map(reg=>reg.unregister()));
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k.startsWith('vi-game-assistant-')).map(k=>caches.delete(k)));
      }
    }catch(err){console.warn('Cache legacy cleanup',err)}
  }
  function setup(){
    if(native()){cleanNative();return}
    if(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'){
      navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
    }
  }
  if(document.readyState==='complete')setup();else addEventListener('load',setup,{once:true});
})();</script>
