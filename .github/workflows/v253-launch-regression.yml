name: Game Atlas V253 - pruebas de noticias automaticas (sin publicar)
on:
  pull_request:
    paths:
      - 'automation/**'
      - '.github/workflows/v210-free-scheduled-catalog.yml'
      - '.github/workflows/v253-launch-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis sin secretos ni publicacion
        run: |
          node --check automation/v210-sources.mjs
          node --check automation/v210-publisher.mjs
          node --check automation/v219-launch-window.mjs
      - name: Revisar firmas, fechas, feeds, resiliencia 503 y wiki
        run: |
          node --test automation/v210-publisher.test.mjs automation/v219-launch-window.test.mjs automation/v220-wiki-spec-translations.test.mjs automation/v220-client-integration.test.mjs automation/v253-manual-news-20261118.test.mjs automation/v253-launch-resilience.test.mjs
