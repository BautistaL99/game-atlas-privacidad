name: Game Atlas V253 - pruebas de noticias automaticas (sin publicar)
on:
  pull_request:
    paths:
      - 'automation/**'
      - 'app/**'
      - '.github/workflows/v210-free-scheduled-catalog.yml'
      - '.github/workflows/v253-launch-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis sin secretos ni publicacion
        run: |
          node --check automation/v210-sources.mjs
          node --check automation/v210-publisher.mjs
          node --check automation/v219-launch-window.mjs
          node --check automation/v255-wiki-image-discovery.mjs
          node --check automation/v255-wiki-image-real-smoke.mjs
          node --check automation/v255-v254-preview-readonly-smoke.mjs
          node --check automation/v255-rebase-on-v254-check.mjs
          node --check automation/v255-merge-v254-semantic.mjs
          node --check app/app-v137.js
          node --check app/community-v206.js
          node --check app/detail-enhancements-v160.js
      - name: Revisar firmas, fechas, feeds, resiliencia 503 y wiki
        run: |
          node --test automation/v210-publisher.test.mjs automation/v219-launch-window.test.mjs automation/v220-wiki-spec-translations.test.mjs automation/v220-client-integration.test.mjs automation/v253-manual-news-20261118.test.mjs automation/v253-launch-resilience.test.mjs automation/v253-client-limits.test.mjs automation/v255-wiki-image-discovery.test.mjs automation/v255-map-qa.test.mjs automation/v255-wiki-overlap.test.mjs
      - name: Probar lectura de una ficha real con fotografia (sin publicar)
        continue-on-error: true
        run: node automation/v255-wiki-image-real-smoke.mjs

      - name: Identificar artefactos V254 de Firebase sin modificar web
        continue-on-error: true
        run: node automation/v255-v254-preview-readonly-smoke.mjs

      - name: Verificar que V255 se pueda superponer sobre V254 sin perder cambios
        continue-on-error: true
        run: node automation/v255-rebase-on-v254-check.mjs

      - name: Probar merge semantico de correcciones sobre V254
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock --ignore-scripts diff-match-patch@1.0.5
          node automation/v255-merge-v254-semantic.mjs
