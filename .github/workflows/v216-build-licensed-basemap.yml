name: V216 construir basemap CC BY 4.0 para Leonida
on:
  push:
    branches: [feature/v216-leonida-map-seo]
    paths: ['.github/workflows/v216-build-licensed-basemap.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  licensed-basemap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Descargar tiles originales GTADB por sparse checkout (NO hotlink)
        uses: actions/checkout@v4
        with:
          repository: rolux/gtadb.org
          ref: 6acc1b555ed68255078b850f5d4a984610fa1910
          sparse-checkout: |
            maps/tiles/6/yanis,17/3
            map/data/6/landmarks.json
          filter: blob:none
          path: upstream
          persist-credentials: false
      - name: Reconstruir base navegable y escribir atribucion de licencia
        run: |
          python -m pip install -q Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re,json
          src=Path('upstream/maps/tiles/6/yanis,17/3')
          records=[]
          for f in src.glob('*.jpg'):
            m=re.fullmatch(r'3,(\d+),(\d+)\.jpg',f.name)
            if m: records.append((int(m[1]),int(m[2]),f))
          assert len(records)>=400,'Tiles Yanis v17 insuficientes'
          minx,maxx=5,24;miny,maxy=5,25
          w,h=256,256
          canvas=Image.new('RGB',((maxx-minx+1)*w,(maxy-miny+1)*h),(44,104,166))
          for y,x,f in records:
            if not(minx<=x<=maxx and miny<=y<=maxy):continue
            with Image.open(f) as tile:
              canvas.paste(tile,((x-minx)*w,(y-miny)*h))
          # Same world-space crop as level-2 preview, at 2x source resolution.
          # Level 2 mosaic starts at tile 2,2; level 3 begins at 5,5.
          crop=(192,64,3552,4544)
          img=canvas.crop(crop).resize((1500,2000),Image.Resampling.LANCZOS)
          out=Path('app/assets');out.mkdir(exist_ok=True)
          img.save(out/'leonida-yanis-v17.webp','WEBP',quality=82,method=5)
          assert (out/'leonida-yanis-v17.webp').stat().st_size<6_000_000
          # GTADB original game XY to level-3 world pixels, then into local crop %.
          # The two geographic axes are not latitude/longitude.
          landmarks=json.loads(Path('upstream/map/data/6/landmarks.json').read_text())
          output=[]
          def cat_for(tags):
            tags=' '.join(tags).lower()
            if any(x in tags for x in ('gun shop','ammu','weapon')):return 'tiendas-armas'
            if any(x in tags for x in ('mechanic','garage','mod shop','repair')):return 'garajes'
            if any(x in tags for x in ('vehicle','car dealer','car dealership')):return 'vehiculos'
            if any(x in tags for x in ('mission','heist')):return 'misiones'
            if any(x in tags for x in ('hotel','restaurant','bar','hospital','police','transport','airport','rail','bus','nightclub','store','retail','clothing','tattoo','bank','shop','fuel','gas station','beach','bridge','marina','subway')):return 'lugares'
            if any(x in tags for x in ('residential','commercial','property','business','factory','industrial')):return 'economia'
            if any(x in tags for x in ('forest','wetland','nature','park')):return 'lugares'
            return 'lugares'
          for key,rec in landmarks.items():
            if not isinstance(rec,list) or len(rec)<7 or not isinstance(rec[0],str):continue
            raw=rec[0].split(',')
            name=raw[0].strip()
            if not name or name=='?' or name.startswith('Unknown') or len(name)<3:continue
            pos=rec[1]
            if not isinstance(pos,list) or len(pos)!=2:continue
            gx,gy=pos
            if not all(isinstance(v,(float,int)) and abs(v)<20000 for v in (gx,gy)):continue
            x=((gx+16384)/4-1472)/3360*100
            y=((16384-gy)/4-1344)/4480*100
            if x<0 or x>100 or y<0 or y>100:continue
            if not re.fullmatch(r'L\d+',key):continue
            tags=rec[6] if isinstance(rec[6],list) else []
            area=', '.join(v.strip() for v in raw[1:3] if v.strip() and v.strip()!='?')
            output.append({
              'id':'community-'+key.lower(),'title':name[:120],
              'note':area[:120],
              'category':cat_for(tags),
              'tags':[str(t)[:60] for t in tags[:8]],
              'kind':'community',
              'x':round(x,4),'y':round(y,4),
              'confidence':'community-reconstruction',
              'sourceId':key
            })
          output.sort(key=lambda rec:rec['id'])
          meta={
            'schema':216,
            'mapVersion':'map-v216-yanis17',
            'source':'https://github.com/rolux/gtadb.org',
            'sourceRef':'6acc1b555ed68255078b850f5d4a984610fa1910',
            'license':'CC BY 4.0',
            'accuracy':'estimated community positions; not verified Rockstar coordinates',
            'items':output
          }
          (out/'leonida-landmarks-v216.json').write_text(json.dumps(meta,ensure_ascii=False,separators=(',',':')))
          assert len(output)>=200, 'Not enough named landmarks to show meaningful zoom clustering'
          print('Named community points:',len(output))
          (out/'LEONIDA-MAP-LICENSE.txt').write_text(
            'GTA VI Map Tiles (CC BY 4.0) — https://map.gtadb.org\n'
            '© 2025–2026 GTADB.ORG and contributors. Yanis V17 community reconstruction.\n'
            'Original repository: https://github.com/rolux/gtadb.org\n'
            'Pinned revision: 6acc1b555ed68255078b850f5d4a984610fa1910\n'
            'License: https://creativecommons.org/licenses/by/4.0/\n'
            'Changes: selected source zoom level 3, mosaicked 420 tiles in tile row/column order,\n'\n            'cropped the reference panel, resized to 1500x2000, re-encoded as WEBP.\n'\n            'GTA VI Landmarks Data (CC BY 4.0) — https://map.gtadb.org.\n'\n            'Changes to points: named records only, approximate coordinates projected to map crop,\n'\n            'categories normalized, numerical coordinates rounded, untranslated proper names.\n'
            'Only the original source map serves as geographic research; positions remain provisional.\n'
            'This is an unofficial approximate community reconstruction, not Rockstar cartography.\n'
            'Original work not endorsed or sponsored by GTADB, Rockstar or Take-Two.\n'
          )
          print('Basemap:',(out/'leonida-yanis-v17.webp').stat().st_size,'bytes')
          PY
      - name: Guardar basemap licenciado solamente en la rama V216
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/assets/leonida-yanis-v17.webp app/assets/leonida-landmarks-v216.json app/assets/LEONIDA-MAP-LICENSE.txt
          if git diff --cached --quiet; then echo 'No source changes';exit 0;fi
          git commit -m "V216: licensed Yanis V17 Leonida community map with provenance and CC BY credits"
          git pull --rebase origin feature/v216-leonida-map-seo
          git push origin HEAD:feature/v216-leonida-map-seo
