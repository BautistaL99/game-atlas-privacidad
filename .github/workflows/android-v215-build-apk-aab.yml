name: Game Atlas Companion V252 - compilar Android APK y AAB
# V252: manual only, to avoid unwanted builds or cost.
on:
  push:
    branches: [qa-android-v252-build]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-atlas-v252-android-build
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Descargar exactamente el contenido web aprobado
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Comprobar app V252, búsquedas y correcciones del mapa antes de compilar
        run: |
          node --check app/app-v137.js
          node qa/v247-public-client.mjs
          node qa/v249-map-monetization-regressions.mjs
          node qa/v250-live-map-billing.mjs app android-v215/www
          node qa/v251-store-ui-and-route.mjs app
          node qa/v252-store-and-parity.mjs app android-v215/www
          node qa/v247-qa-marker-switch.mjs
          node qa/v247-qa-ranking-truth.mjs
          node android-v215/prepare-android.mjs stage
          node qa/v252-store-and-parity.mjs app android-v215/www
          node --check android-v215/www/mobile-v215.js
          node --check android-v215/www/community-v206.js
          node --check android-v215/www/online-updates.js
          node --check android-v215/www/news-v155.js
      - name: Instalar Capacitor 8 sin servicios de pago
        working-directory: android-v215
        run: |
          npm install --no-fund --no-audit
          npx cap add android
          npx cap sync android
      - name: Mantener identidad de Play, apariencia y API 36
        run: |
          node android-v215/prepare-android.mjs native
          grep -q 'versionCode 252' android-v215/android/app/build.gradle
          grep -q 'targetSdkVersion = 36' android-v215/android/variables.gradle
          grep -q 'community-v206.js' android-v215/www/index.html
          grep -q 'mobile-v215.css' android-v215/www/index.html
      - name: Verificar iconos adaptativos del VI en la aplicación
        run: |
          test -s android-v215/android/app/src/main/res/drawable-nodpi/ga_launcher_logo.png
          test -s android-v215/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          grep -q 'ic_launcher_foreground' android-v215/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'ic_launcher_foreground' android-v215/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          grep -q 'ga_launcher_background' android-v215/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'map-v248-focus-search.css' android-v215/www/index.html
      - name: Compilar APK para pruebas y AAB de release sin firmar
        working-directory: android-v215/android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.parallel=false'
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace
      - name: Verificar archivos Android, paquete, assets y hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android-v215
          APK="android-v215/android/app/build/outputs/apk/debug/app-debug.apk"
          AAB="android-v215/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          unzip -l "$APK" | grep -q 'assets/public/index.html'
          unzip -l "$APK" | grep -q 'assets/public/community-v206.js'
          unzip -l "$APK" | grep -q 'assets/public/mobile-v215.css'
          unzip -l "$APK" | grep -q 'assets/public/online-updates.js'
          unzip -l "$AAB" | grep -q 'base/assets/public/community-v206.js'
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.indie.viassistant.qa'"
          "$AAPT" dump badging "$APK" | grep "versionCode='252'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          cp "$APK" dist/android-v215/Game-Atlas-Companion-V252-PRUEBA.apk
          cp "$AAB" dist/android-v215/Game-Atlas-Companion-V252-PRUEBA-SIN-FIRMAR.aab
          (cd dist/android-v215 && sha256sum Game-Atlas-Companion-V252-PRUEBA.apk Game-Atlas-Companion-V252-PRUEBA-SIN-FIRMAR.aab > SHA256SUMS.txt)
          cat > dist/android-v215/LEEME-ANDROID-V252.txt <<'TXT'
          Game Atlas Companion - Android V252 (versionName 1.55.0; versionCode 252)
          APK DEBUG: com.indie.viassistant.qa (INSTALACIÓN PARALELA)
          AAB RELEASE: com.indie.viassistant (mismo ID original de Google Play)
          APK: archivo instalable de PRUEBA, firmado con clave de desarrollo
          AAB: paquete de lanzamiento SIN FIRMAR. NO puede enviarse directamente a Play Console.
          La AAB definitiva requiere firmarla con la clave de SUBIDA de Google Play ya autorizada.
          Este APK se llama Game Atlas V252 TEST y NO reemplaza tu app de Play.
          Los datos estan aislados: importar Mi partida JSON si queres trasladarlos.
          Novedades: código V252 de Android/iOS (la web pública conserva V250); noticias oficiales y medios independientes;
          fichas comunitarias separadas; catalogos remotos firmados Ed25519;
          idiomas ES/EN/PT; mapa, marcadores, favoritos y progreso local.
          Se consultan al abrir/reanudar y aproximadamente cada 30 min si esta abierta.
          La publicacion de nuevas noticias depende del horario del recopilador.
          No existe sincronizacion en la nube de favoritos/progreso.
          TXT
          ls -lh dist/android-v215
      - name: Comparar TODOS los recursos e imágenes del APK y AAB con los archivos probados
        run: |
          python3 qa/v252-android-package-parity.py app android-v215/www dist/android-v215/Game-Atlas-Companion-V252-PRUEBA.apk dist/android-v215/Game-Atlas-Companion-V252-PRUEBA-SIN-FIRMAR.aab > dist/android-v215/PARIDAD_APK_AAB_V252.json
          cat dist/android-v215/PARIDAD_APK_AAB_V252.json
      - name: Entregar APK y AAB descargables desde Actions
        uses: actions/upload-artifact@v4
        with:
          name: GAME-ATLAS-ANDROID-V252-APK-Y-AAB
          path: dist/android-v215/
          retention-days: 30
          if-no-files-found: error
