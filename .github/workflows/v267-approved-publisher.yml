name: Game Atlas - publicador V265 de lotes aprobados
on:
  pull_request:
    paths:
      - 'automation/v267/**'
      - '.github/workflows/v267-approved-publisher.yml'
      - 'automation/approved-batches/**'
  schedule:
    - cron: '53 10 * * *'
  push:
    branches: [main]
    paths:
      - 'automation/approved-batches/pending.json'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Publicar lote previamente aprobado; falso = verificar sin escribir'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: atlas-v267-owner-reviewed-publisher
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          echo '9e93ba4883dc76ca9889bb683f54c1c4db660dc884ae4f80dfd6168f4a526b49  automation/v267/content-schema-v265.cjs' | sha256sum -c -
          node --test automation/v267/approved-publisher.test.mjs automation/v267/auto-review.test.mjs automation/v267/health-audit.test.mjs
      - name: Audit actual signed feeds without credentials
        run: node automation/v267/health-audit.mjs
      - name: Live policy review without secrets or publication
        if: github.event_name == 'pull_request'
        run: node automation/v267/auto-review.mjs
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: atlas-policy-review-test
          path: review-queue/auto-review-report.json
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live sources and documented image permissions without signing key
        if: github.event_name != 'push'
        run: node automation/v267/auto-review.mjs
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: atlas-policy-review
          path: review-queue/auto-review-report.json
      - name: Audit current feeds before signing
        run: node automation/v267/health-audit.mjs
      - name: Verify and sign reviewed batch, if present
        env:
          ATLAS_V265_SIGNING_KEY: ${{ secrets.ATLAS_V265_SIGNING_KEY }}
          ATLAS_APPLY: ${{ (github.event_name != 'workflow_dispatch' || inputs.apply) && 'true' || 'false' }}
        run: node automation/v267/approved-publisher.mjs
      - name: Commit only data and never overwrite a newer revision
        if: github.event_name != 'workflow_dispatch' || inputs.apply
        run: |
          set -euo pipefail
          git add updates/approved-content-v265.json
          if git ls-files --error-unmatch automation/approved-batches/pending.json >/dev/null 2>&1; then git add -u automation/approved-batches/pending.json; fi
          if [ -d updates/approved-parts ]; then git add updates/approved-parts; fi
          if [ -d updates/assets ]; then git add updates/assets; fi
          if git diff --cached --quiet; then echo "No reviewed data to publish"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "Main changed; retry with current revision"; exit 1; }
          git commit -m 'Game Atlas: publish reviewed V265 data'
          git push origin HEAD:main
