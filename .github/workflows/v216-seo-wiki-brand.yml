name: V216 corregir SEO Wiki marca URL canonica
on:
  push:
    branches: [feature/v216-leonida-map-seo]
    paths: ['.github/workflows/v216-seo-wiki-brand.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Corregir páginas estáticas, branding, robots y sitemap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,html,json
          from pathlib import Path
          origin='https://bautistal99.github.io/game-atlas-privacidad'
          base='https://gta6mapa.web.app'
          name='Game Atlas: Guía de GTA 6'
          root=Path('guia-gta-6')
          pages=list(root.rglob('*.html'))
          assert len(pages)>12, 'missing SEO pages'
          for p in pages:
            s=p.read_text()
            s=s.replace(origin,base)
            if p==root/'index.html':
              s=s.replace('content="noindex,follow"','content="index,follow,max-image-preview:large"')
              assert 'content="index,follow' in s
            if p==root/'index.html':
              title='Game Atlas: Guía de GTA 6 | Wiki, noticias, mapa y rutas'
              s=re.sub(r'<title>[^<]*</title>',f'<title>{title}</title>',s,count=1)
              s=re.sub(r'(<meta name="description" content=")[^"]*(")',r'\1Wiki de GTA 6 y guía no oficial de Leonida: noticias, mapa interactivo, vehículos, personajes, misiones y rutas.\2',s,count=1)
            else:
              title_m=re.search(r'<title>([^<]+)</title>',s)
              if title_m and name.casefold() not in title_m.group(1).casefold():
                original=title_m.group(1).split('|')[0].strip()
                title=original[:53].rstrip()+' | '+name
                s=s.replace(title_m.group(0),'<title>'+html.escape(title)+'</title>',1)
            if 'property="og:site_name"' in s:
              s=re.sub(r'<meta property="og:site_name" content="[^"]*">','<meta property="og:site_name" content="'+name+'">',s,count=1)
            else:
              s=s.replace('</title>','</title><meta property="og:site_name" content="'+name+'">',1)
            s=s.replace('GTA <em>6</em> · GUÍA',name)
            s=s.replace('Game Atlas Companion',name)
            if '/wiki/' not in str(p):
              wiki=f'<a href="{base}/guia-gta-6/wiki/">Wiki GTA 6</a>'
              nav_open='<nav aria-label="Secciones de la guía">'
              if nav_open in s and 'Wiki GTA 6</a>' not in s:
                s=s.replace(nav_open,nav_open+wiki,1)
            assert '<link rel="canonical"' in s, 'missing canonical '+str(p)
            assert origin not in s, 'old origin '+str(p)
            p.write_text(s)
          # Independent readable wiki landing page, without invented gameplay facts.
          wiki=root/'wiki'/'index.html';wiki.parent.mkdir(parents=True,exist_ok=True)
          canon=base+'/guia-gta-6/wiki/'
          sections=[
            ('Personajes','personajes','Perfiles, relaciones y fuentes que identifican qué datos están confirmados.'),
            ('Vehículos','vehiculos','Catálogo consultable de vehículos, modelos y datos disponibles.'),
            ('Armas','armas','Fichas y comparaciones con datos verificados o pendientes.'),
            ('Mapa de Leonida','mapa','Mapa comunitario aproximado con búsqueda, filtros y marcadores.'),
            ('Noticias','noticias','Anuncios oficiales y fuentes independientes, diferenciados.'),
            ('Mi partida','mi-partida','Favoritos, coleccionables, rutas y progreso guardados en el dispositivo.')
          ]
          links=''.join('<article><h2><a href="'+base+'/guia-gta-6/'+slug+'/">'+t+'</a></h2><p>'+d+'</p></article>' for t,slug,d in sections)
          metadata={"@context":"https://schema.org","@type":"CollectionPage","name":"Wiki de GTA 6 | Game Atlas: Guía de GTA 6","url":canon,"inLanguage":"es","description":"Wiki independiente de GTA VI: personajes, vehículos, armas, mapa, noticias y rutas, con fuentes y advertencias sobre datos comunitarios.","isAccessibleForFree":True}
          document=f'''<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Wiki GTA 6: personajes, mapa y guías | Game Atlas</title>
          <meta name="robots" content="index,follow,max-image-preview:large">
          <meta name="description" content="Wiki de GTA 6 en español de Game Atlas: personajes, mapa interactivo, vehículos, armas, rutas, noticias oficiales y fichas con fuentes verificables.">
          <link rel="canonical" href="{canon}"><link rel="stylesheet" href="{base}/guia-gta-6/seo.css">
          <meta property="og:type" content="website"><meta property="og:site_name" content="{name}"><meta property="og:title" content="Wiki GTA 6 | Game Atlas">
          <meta property="og:url" content="{canon}"><script type="application/ld+json">{json.dumps(metadata,ensure_ascii=False)}</script></head>
          <body><header><div class="top"><a class="logo" href="{base}/guia-gta-6/">{name}</a>
          <a class="app-link" href="{base}/app/">Abrir mapa interactivo</a></div>
          <nav aria-label="Secciones de la guía"><a href="{base}/guia-gta-6/">Inicio</a><a href="{base}/guia-gta-6/mapa/">Mapa</a><a aria-current="page" href="{canon}">Wiki</a><a href="{base}/guia-gta-6/noticias/">Noticias</a></nav></header>
          <main><div class="intro"><p class="eyebrow">ENCICLOPEDIA INDEPENDIENTE · GTA VI</p><h1>Wiki de GTA 6</h1>
          <p>Consultá la información pública de Grand Theft Auto VI con referencias, fichas enlazadas y un mapa interactivo.
          Separamos los anuncios de Rockstar de la investigación comunitaria y los rumores.</p></div>
          <section class="card-grid">{links}</section>
          <section><h2>¿Qué está confirmado?</h2><p>Un nombre publicado oficialmente puede estar confirmado, aunque su posición concreta en el mapa sea una estimación de los fans.
          Las ubicaciones del mapa de Leonida se basan en una reconstrucción comunitaria de GTADB bajo CC BY 4.0, no en un mapa oficial del juego.
          Las guías de misiones y los easter eggs se completarán solo con información comprobable.</p>
          <p>Para explorar fichas dentro de la aplicación, entrá en <a href="{base}/app/#/explorar">Explorar el catálogo</a>. También podés usar el
          <a href="{base}/app/#/mapa">mapa y las rutas personales</a>.</p></section></main>
          <footer><p>{name} — Guía no oficial. Sin afiliación con Rockstar Games ni Take-Two Interactive.</p></footer></body></html>'''
          wiki.write_text(document)
          manifest=Path('app/manifest.webmanifest')
          m=json.loads(manifest.read_text())
          m['name']=name;m['short_name']='Game Atlas GTA 6'
          m['description']='Wiki y guía independiente de GTA 6: mapa de Leonida, rutas, noticias y fichas.'
          manifest.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          for path in [Path('index.html'),Path('app/privacy.html')]:
            if path.exists():
              s=path.read_text().replace('Game Atlas Companion',name)
              path.write_text(s)
          sitemap=Path('sitemap.xml')
          sm=sitemap.read_text().replace(origin,base)
          assert '<urlset' in sm and '</urlset>' in sm
          add='  <url><loc>'+base+'/guia-gta-6/</loc></url>\n  <url><loc>'+canon+'</loc></url>\n'
          sm=sm.replace('</urlset>',add+'</urlset>')
          sitemap.write_text(sm)
          Path('robots.txt').write_text('User-agent: *\nAllow: /\nSitemap: '+base+'/sitemap.xml\n')
          assert 'noindex,follow' not in (root/'index.html').read_text()
          assert origin not in sitemap.read_text()
          print('V216 SEO: rewritten',len(pages),'HTML pages; updated sitemap, robots, public brand and wiki')
          PY
      - name: Persistir solo la rama V216, no publicar producción
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guia-gta-6/ app/manifest.webmanifest app/privacy.html index.html sitemap.xml robots.txt
          if git diff --cached --quiet;then echo 'Nothing changed';exit 0;fi
          git commit -m "V216 SEO: game atlas brand, indexable wiki, canonical URLs and sitemap"
          git pull --rebase origin feature/v216-leonida-map-seo
          git push origin HEAD:feature/v216-leonida-map-seo
