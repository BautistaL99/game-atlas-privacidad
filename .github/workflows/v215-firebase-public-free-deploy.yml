name: V215 publicar Firebase gratis usando GitHub publico
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v215-firebase-public-free-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-atlas-firebase-v215-public
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar V215 aprobada y feeds publicos
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {existsSync,readFileSync} from 'node:fs';
          const required=[
            'app/index.html','app/sw.js','app/mobile-v215.css','app/mobile-v215.js',
            'app/mobile-v212.css','app/mobile-v212.js','app/mobile-v212-fixes.css',
            'app/mobile-v211.css','app/mobile-v211.js',
            'updates/catalog-envelope.json','updates/community-envelope-v205.json',
            'sitemap.xml','guia-gta-6/index.html'
          ];
          for(const p of required)if(!existsSync(p)||!readFileSync(p).length)throw Error('Falta '+p);
          const html=readFileSync('app/index.html','utf8'),sw=readFileSync('app/sw.js','utf8');
          for(const name of ['mobile-v211.css','mobile-v211.js','mobile-v212-fixes.css','mobile-v212.css','mobile-v212.js','mobile-v215.css','mobile-v215.js']){
            if(!html.includes('./'+name+'?rev=visible-mobile-v215-20261112'))throw Error('La web no es V215: '+name);
          }
          if(!sw.includes("const CACHE='game-atlas-safe-v215-mobile'"))throw Error('Cache SW no corresponde a V215');
          for(const p of ['updates/catalog-envelope.json','updates/community-envelope-v205.json'])JSON.parse(readFileSync(p,'utf8'));
          console.log('V215 correcta, feeds preservados y archivos completos');
          JS
      - name: Preparar clave Firebase de forma segura (JSON o base64)
        env:
          FIREBASE_SERVICE_ACCOUNT_GTA6MAPA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GTA6MAPA }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const original=(process.env.FIREBASE_SERVICE_ACCOUNT_GTA6MAPA||'').trim();
          if(!original)throw Error('No existe secreto Firebase en este repositorio; no se publico nada');
          const candidates=[original.replace(/^\uFEFF/,'')];
          const tick=String.fromCharCode(96);
          if(original.startsWith(tick.repeat(3)))candidates.push(original.replace(new RegExp('^'+tick+'{3}(?:json)?\\s*','i'),'').replace(new RegExp('\\s*'+tick+'{3}$'),''));
          const compact=original.replace(/\s+/g,'');
          if(compact.length>100&&/^[A-Za-z0-9+/_=-]+$/.test(compact)){
            try{candidates.push(Buffer.from(compact.replace(/-/g,'+').replace(/_/g,'/'),'base64').toString('utf8').replace(/^\uFEFF/,''))}catch{}
          }
          let key;
          for(const option of candidates){
            try{
              let obj=JSON.parse(option);
              if(typeof obj==='string')obj=JSON.parse(obj);
              if(obj&&typeof obj==='object'&&obj.type==='service_account'&&obj.project_id==='gta6mapa'&&obj.private_key&&obj.client_email){key=obj;break;}
            }catch{}
          }
          // The user may have saved only the original active service-account PEM.
          // Reconstruct the standard credential in runner memory from public account metadata.
          // Never write credentials to repository, summary, workflow outputs or logs.
          if(!key&&original.startsWith('-----BEGIN PRIVATE KEY-----')){
            const pem=original.replace(/\\n/g,'\n').replace(/\r/g,'').trim()+'\n';
            if(!pem.includes('-----END PRIVATE KEY-----'))throw Error('Clave PEM incompleta. No se publico nada');
            key={
              type:'service_account',
              project_id:'gta6mapa',
              private_key_id:'ef791aeb03ac62a7e130c54d0fc15527057062ef',
              private_key:pem,
              client_email:'github-action-1445078769@gta6mapa.iam.gserviceaccount.com',
              client_id:'117668602201494757061',
              auth_uri:'https://accounts.google.com/o/oauth2/auth',
              token_uri:'https://oauth2.googleapis.com/token',
              auth_provider_x509_cert_url:'https://www.googleapis.com/oauth2/v1/certs',
              client_x509_cert_url:'https://www.googleapis.com/robot/v1/metadata/x509/github-action-1445078769%40gta6mapa.iam.gserviceaccount.com',
              universe_domain:'googleapis.com'
            };
            console.log('Clave PEM existente preparada como credencial Firebase sin revelar material secreto');
          }
          if(!key){
            const trimmed=original.trim();
            const kind=trimmed.startsWith('{')?'empieza como JSON':
              trimmed.startsWith('[')?'empieza como lista':
              trimmed.startsWith('"')?'empieza entre comillas':
              trimmed.startsWith('-----BEGIN')?'parece una clave PEM suelta':
              trimmed.startsWith('data:')?'parece un enlace de datos':
              /^[A-Za-z0-9+/_=-]+$/.test(trimmed)&&trimmed.length>80?'parece texto codificado':
              /\.(json|txt)$/i.test(trimmed)?'parece un nombre de archivo':
              'otro tipo de texto';
            const complete=trimmed.includes('"private_key"')&&trimmed.includes('"project_id"')&&trimmed.includes('"client_email"');
            const hasJsonMarkers=trimmed.includes('"private_key"')||trimmed.includes('"project_id"');
            console.log('Diagnostico privado de formato (sin datos): '+kind+'; campos de JSON '+(complete?'presentes':hasJsonMarkers?'parciales':'ausentes'));
            throw Error('El secreto no se puede interpretar como JSON de Firebase. No se publico nada');
          }
          const dest=process.env.RUNNER_TEMP+'/firebase-gta6mapa-v215-service-account.json';
          writeFileSync(dest,JSON.stringify(key),{mode:0o600});
          console.log('Credencial valida de gta6mapa preparada exclusivamente en runner (sin mostrarla)');
          JS
      - name: Validar firma de clave contra Google OAuth sin mostrar tokens
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-gta6mapa-v215-service-account.json
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createPrivateKey,createSign} from 'node:crypto';
          const cfg=JSON.parse(readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));
          try{createPrivateKey(cfg.private_key)}catch{throw Error('La clave privada no contiene una clave criptografica utilizable')}
          const now=Math.floor(Date.now()/1000);
          const head=Buffer.from(JSON.stringify({alg:'RS256',typ:'JWT',kid:cfg.private_key_id})).toString('base64url');
          const payload=Buffer.from(JSON.stringify({
            iss:cfg.client_email,scope:'https://www.googleapis.com/auth/firebase https://www.googleapis.com/auth/cloud-platform',
            aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+3000
          })).toString('base64url');
          const signingInput=head+'.'+payload;
          const signer=createSign('RSA-SHA256');
          signer.update(signingInput);signer.end();
          const jwt=signingInput+'.'+signer.sign(cfg.private_key,'base64url');
          const body=new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:jwt});
          const response=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
          if(!response.ok){
            const error=await response.json().catch(()=>({}));
            console.error('Google OAuth rechazo la clave. Codigo '+response.status+' motivo '+String(error.error||'desconocido')+' / '+String(error.error_description||'no detallado').slice(0,120));
            throw Error('Google OAuth no acepto la identidad. Se cancela sin publicar');
          }
          console.log('Google OAuth valido la identidad. Token de acceso verificado sin imprimirlo');
          JS
      - name: Armar espejo Firebase con version V215 ya publicada en Pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firebase-hosting/site
          cp -a app updates guia-gta-6 firebase-hosting/site/
          cp index.html sitemap.xml firebase-hosting/site/
          find . -maxdepth 1 -type f -name 'google*.html' -exec cp '{}' firebase-hosting/site/ ';'
          cat > firebase.json <<'JSON'
          {
            "hosting": {
              "site": "gta6mapa",
              "public": "firebase-hosting/site",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "redirects": [{"source": "/", "destination": "/app/", "type": 302}],
              "headers": [
                {"source": "**/*.html", "headers": [{"key": "Cache-Control", "value": "no-cache, no-store, must-revalidate"}]},
                {"source": "**/*.json", "headers": [{"key": "Cache-Control", "value": "no-cache, max-age=0, must-revalidate"}]},
                {"source": "**/sw.js", "headers": [{"key": "Cache-Control", "value": "no-cache, no-store, must-revalidate"}]}
              ]
            }
          }
          JSON
          echo '{"projects":{"default":"gta6mapa"}}' > .firebaserc
          cmp app/index.html firebase-hosting/site/app/index.html
          cmp updates/catalog-envelope.json firebase-hosting/site/updates/catalog-envelope.json
          cmp updates/community-envelope-v205.json firebase-hosting/site/updates/community-envelope-v205.json
      - name: Desplegar Firebase LIVE con credencial temporal en runner
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-gta6mapa-v215-service-account.json
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.22.1 deploy --only hosting --project gta6mapa --non-interactive
      - name: Confirmar que Firebase sirve el HTML CSS y feeds exactos
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl -fsSL --max-time 18 "https://gta6mapa.web.app/app/index.html?release=${GITHUB_SHA}" -o /tmp/index-v215.html &&
               cmp -s app/index.html /tmp/index-v215.html &&
               curl -fsSL --max-time 18 "https://gta6mapa.web.app/app/mobile-v215.css?release=${GITHUB_SHA}" -o /tmp/style-v215.css &&
               cmp -s app/mobile-v215.css /tmp/style-v215.css &&
               curl -fsSL --max-time 18 "https://gta6mapa.web.app/updates/catalog-envelope.json?release=${GITHUB_SHA}" -o /tmp/feed-v215.json &&
               cmp -s updates/catalog-envelope.json /tmp/feed-v215.json &&
               curl -fsSL --max-time 18 "https://gta6mapa.web.app/updates/community-envelope-v205.json?release=${GITHUB_SHA}" -o /tmp/community-v215.json &&
               cmp -s updates/community-envelope-v205.json /tmp/community-v215.json; then
              echo 'V215 PUBLICADA Y VERIFICADA EN FIREBASE'
              echo 'Sitio oficial: https://gta6mapa.web.app/app/' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo '::error::Firebase no devuelve aun la version V215 identica a la aprobada'
          exit 1
