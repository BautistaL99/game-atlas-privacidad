name: Preparacion V210 - comprobar firma y permisos gratis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v210-setup-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SIGN_KEY: ${{ secrets.CATALOG_SIGNING_KEY_PEM_BASE64 }}
      SITE_TOKEN: ${{ secrets.PUBLIC_SITE_DEPLOY_TOKEN }}
    steps:
      - name: Comprobar secretos SIN mostrarlos ni copiarlos
        run: |
          test -n "$SIGN_KEY" && echo "Signing key: configured" || echo "Signing key: NOT CONFIGURED"
          test -n "$SITE_TOKEN" && echo "Legacy deploy token: configured" || echo "Legacy deploy token: not needed (public runner uses GITHUB_TOKEN)"
          echo "Public runner starts; no credit card or private Actions minutes needed"
